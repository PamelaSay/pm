<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Plano de Corte</title>
    <link rel="stylesheet" href="planodecorte.css">
</head>
<body>

    <div class="painel-controle">
        <h2>Configuração do Tecido e Peças</h2>
        
        <!-- Controle da Largura do Tecido -->
        <div class="grupo-campo">
            <label for="larguraTecido">Largura do Tecido (m):</label>
            <input type="number" id="larguraTecido" value="1.50" step="0.01" onchange="atualizarTecido()">
        </div>

        <hr>

        <!-- Formulário para Adicionar Peças -->
        <form onsubmit="adicionarPeca(event)">
            <div class="grupo-campo">
                <label>Nome da Peça:</label>
                <input type="text" id="nomePeca" placeholder="Ex: Calça, Blusa" required>
            </div>
            <div class="grupo-campo">
                <label>Altura (m):</label>
                <input type="number" id="alturaPeca" step="0.01" placeholder="Ex: 1.06" required>
            </div>
            <div class="grupo-campo">
                <label>Largura (m):</label>
                <input type="number" id="larguraPeca" step="0.01" placeholder="Ex: 0.40" required>
            </div>
            <div class="grupo-campo">
                <label>Quantidade:</label>
                <input type="number" id="quantidadePeca" value="1" min="1" required>
            </div>
            <div class="grupo-campo">
                <label>Sentido:</label>
                <select id="sentidoPeca">
                    <option value="urdume">Normal (Urdume)</option>
                    <option value="trama">Trave / Invertido</option>
                    <option value="enviesado">Enviesado</option>
                </select>
            </div>

            <div class="botoes-acao">
                <button type="submit" class="btn-adicionar">Adicionar Peça</button>
                <button type="button" class="btn-novo" onclick="novoPlanoDeCorte()">Novo Plano</button>
            </div>
        </form>
    </div>

    <!-- Área Visual do Tecido -->
    <div id="tecido" class="tecido-container">
        <div class="faixa-ourelha esquerda">Ourela</div>
        <div id="conteudo-tecido"></div>
        <div class="faixa-ourelha direita">Ourela</div>
    </div>

    <script src="planodecorte.js"></script>
</body>
<footer>@2024_ Criado por Pamela Mendonça</footer>
</html>
