<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pamelete Corte | Plano de Corte Inteligente</title>
    <link rel="stylesheet" href="planodecorte.css">
    <link rel="stylesheet"href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css">
</head>
    
<body>
<header>
    <div class="logo">
        <i class="fa-solid fa-scissors"></i>
        <div>
            <h1>PAMELETE CORTE</h1> 
            <span>Sistema Inteligente de Plano de Corte</span>
        </div>
    </div>
</header>

<main class="container">
<section class="card">
    <h2> <i class="fa-solid fa-ruler-combined"></i>Dados do Tecido</h2>
    <div class="linha-form">
        <div class="campo medida"><label>Largura do tecido (m)</label>
            <input type="number" id="larguraTecido" step="0.01" placeholder="1.40"> </div>
        <div class="campo medida"> <label>Margem de Segurança(cm)</label>
            <input type="number" id="margem" value="0.5" min="0.5" max="10">
        </div>
    </div>
</section>

<section class="card">
    <h2> <i class="fa-solid fa-layer-group"></i>Cadastro das Peças</h2>
    <input type="hidden" id="indiceEdicao">
    
    <div class="linha-form">
        <div class="campo nome"><label>Nome da peça</label><input type="text" id="nomePeca" placeholder="Frente"></div>
        <div class="campo medida"> <label>Altura (m)</label> <input type="number" id="alturaPeca" step="0.01"></div>
        <div class="campo medida"> <label>Largura (m)</label> <input type="number" id="larguraPeca" step="0.01"></div>
        <div class="campo quantidade"> <label>Quantidade</label> <input type="number" id="quantidadePeca" value="1"></div>
        <div class="campo sentido"> <label>Sentido do fio</label>
                    <select id="sentidoPeca">
                        <option value="ourela">Ourela</option>
                        <option value="trama">Trama</option>
                        <option value="enviesado">45° (Viés)</option>
                     </select>
                </div>
         <div class="campo espelho"><label>Espelhar?</label>
                    <select id="espelhar">
                        <option value="nao">Não</option>
                        <option value="sim">Sim</option>
                    </select>
        </div>
    </div>

    


    <div class="botoes">
        <button id="btnAdicionar"> <i class="fa-solid fa-plus"></i>Adicionar</button>
        <button id="btnCancelar">Cancelar</button>
    </div>

</section>

<!-- ========================= -->
<!-- LISTA DE PEÇAS            -->
<!-- ========================= -->

<section class="card">

    <h2>
        <i class="fa-solid fa-list"></i>
        Lista de Peças
    </h2>

    <div class="tabela-container">
        <table id="tabelaPecas">
            <thead>
                <tr>
                    <th>Peça</th>
                    <th>Altura</th>
                    <th>Largura</th>
                    <th>Qtd.</th>
                    <th>Sentido</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody>
            </tbody>
         </table>
      </div>
</section>

<!-- ========================= -->
<!-- PLANO DE CORTE            -->
<!-- ========================= -->

<section class="card">
    <h2><i class="fa-solid fa-scissors"></i>Plano de Corte</h2>
    <div class="painel-tecido">
        <div class="ourela esquerda"> OURELA </div>
        <div id="tecido">
            <div id="areaCorte"> </div>
        </div>
        <div class="ourela direita"> OURELA</div>
    </div>
  </section>



<!-- ========================= -->
<!-- RESULTADOS                -->
<!-- ========================= -->

<section class="card">
    <h2> <i class="fa-solid fa-chart-column"></i> Resultado </h2>
    <div class="cardsResultado">
        <div class="resultado">
            <span>Metragem</span>
            <h3 id="metragem"> 0,00 m </h3>
        </div>
       
        <div class="resultado">
            <span>Desperdício</span>
            <h3 id="desperdicio"> 0,00 m </h3>
        </div>
    </div>
</section>


<!-- ========================= -->
<!-- BOTÕES                    -->
<!-- ========================= -->

<section class="acoes">
    <button id="btnCalcular">
        <i class="fa-solid fa-calculator"></i> Calcular Plano
    </button>

    <button id="btnLimpar">
        <i class="fa-solid fa-trash"></i>Limpar Projeto
    </button>

    <button id="btnSalvarProjeto">
        <i class="fa-solid fa-floppy-disk"></i> Salvar Projeto
    </button>

    <button id="btnImprimir">
        <i class="fa-solid fa-print"></i> Imprimir
    </button>

</section>


<footer>
    <p> © Pamelete • Sistema Inteligente de Plano de Corte </p>
</footer>

</main>
 <script src="planodecorte.js"></script>
</body>
   
</html>
