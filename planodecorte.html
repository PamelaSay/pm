<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plano de Corte de Tecido - Pamelete</title>
    <!-- FontAwesome para os ícones de ação -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="planodecorte.css">
</head>
<body>
    <div class="container">
        <h1>Plano de Corte de Tecido</h1>

        <!-- Seção de Ourela (Largura Fixa) -->
        <div class="input-container noprint">
            <label for="larguraTecido">Ourela do Tecido (Largura em metros):</label>
            <div class="linha-ourelha">
                <input type="number" id="larguraTecido" placeholder="Ex: 1.40" min="0" step="0.01">
                <button type="button" id="btnDefinirOurela">Definir Ourela</button>
                <button type="button" id="btnNovoPlano" title="Iniciar novo plano"><i class="fa-solid fa-rotate-right"></i> Novo</button>
            </div>
        </div>

        <!-- Seção de Adicionar Peça -->
        <div class="adicionar-peca noprint">
            <h3 id="tituloFormulario">Adicionar Peça</h3>
            <input type="hidden" id="indiceEdicao" value="">
            
            <div class="linha">
                <div>
                    <label for="nomePeca">Nome:</label>
                    <input type="text" id="nomePeca" placeholder="Descrição">
                </div>
                <div>
                    <label for="alturaPeca">Altura (m):</label>
                    <input type="number" id="alturaPeca" placeholder="Ex: 0.77" min="0" step="0.01">
                </div>
                <div>
                    <label for="larguraPeca">Largura (m):</label>
                    <input type="number" id="larguraPeca" placeholder="Ex: 1.07" min="0" step="0.01">
                </div>
                <div>
                    <label for="quantidadePeca">Quant.:</label>
                    <input type="number" id="quantidadePeca" placeholder="Ex: 1" min="1" value="1">
                </div>
                <div>
                    <label for="sentidoPeca">Sentido do Fio:</label>
                    <select id="sentidoPeca">
                        <option value="ourela">Ourela / Urdume (Normal)</option>
                        <option value="trama">Trama (Transversal)</option>
                        <option value="enviesado">Enviesado (45° Diagonal)</option>
                    </select>
                </div>
            </div>
            
            <div class="botoes-form">
                <button type="button" id="btnSalvar">Adicionar Peça</button>
                <button type="button" id="btnCancelar" class="btn-cancelar-escondido">Cancelar</button>
            </div>
        </div>

        <!-- Lista das Peças -->
        <div class="lista-pecas noprint">
            <h3>Lista das Peças</h3>
            <table id="tabelaPecas">
                <thead>
                    <tr>
                        <th>Nome</th>
                        <th>Altura (m)</th>
                        <th>Largura (m)</th>
                        <th>Sentido do Fio</th>
                        <th>Quantidade</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Inserido dinamicamente -->
                </tbody>
            </table>
        </div>

        <!-- Plano de Corte -->
        <h3>Plano de Corte e Aproveitamento</h3>
        <div class="plano-corte-wrapper">
            <div id="tecido">
                <div class="faixa-ourela esquerda">OURELA</div>
                <div class="faixa-ourela direita">OURELA</div>
                <div id="conteudo-tecido">
                    <!-- As peças ficam estritamente dentro da área útil delimitada pelas ourelas -->
                </div>
            </div>
        </div>

        <!-- Metragem Automática em Destaque -->
        <div class="metragem-destaque">
            <i class="fa-solid fa-scissors"></i>
            <span id="resultado">Defina a largura da ourela e adicione as peças para ver a metragem necessária.</span>
        </div>

        <!-- Imprimir Plano -->
        <div class="impressao noprint">
            <button type="button" id="btnImprimir">Imprimir Plano de Corte</button>
        </div>
    </div>

    <script src="planodecorte.js"></script>
</body>
<footer>@2024_ Criado por Pamela Mendonça</footer>
</html>
